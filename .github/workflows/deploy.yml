# Build the docs from master and publish them to the root of the gh-pages
# branch, which GitHub Pages serves at https://nixpulvis.com/ratmark/
# (Settings > Pages > Deploy from a branch > gh-pages).
name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # For -Zrustdoc-map, below.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # Every feature, as on docs.rs, with links to other crates at the
      # versions in Cargo.lock. -Zrustdoc-map sends crates.io dependencies to
      # docs.rs, as docs.rs does. ratatui-core and pulldown-kram are git
      # dependencies, which docs.rs doesn't have, so they're documented here
      # too, and --extern-html-root-url says where. Without it, rustdoc only
      # links them when their docs happen to be written first.
      - env:
          CARGO_DOC_EXTERN_MAP_REGISTRIES_CRATES_IO: https://docs.rs/
          RUSTDOCFLAGS: >-
            -Zunstable-options
            --extern-html-root-url ratatui_core=https://nixpulvis.com/ratmark/
            --extern-html-root-url pulldown_kram=https://nixpulvis.com/ratmark/
        run: >
          cargo doc --locked --no-deps --all-features -Zrustdoc-map
          -p ratmark -p ratatui-core -p pulldown-kram

      # rustdoc puts the crate's docs under ratmark/, with nothing at the
      # root, so send the root there. .nojekyll keeps Pages from running the
      # files through Jekyll.
      - name: Add root redirect
        run: |
          rm -f target/doc/.lock
          touch target/doc/.nojekyll
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>ratmark</title>
          <meta http-equiv="refresh" content="0; url=ratmark/">
          <link rel="canonical" href="ratmark/">
          <a href="ratmark/">ratmark</a>
          EOF

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/doc
          branch: gh-pages
