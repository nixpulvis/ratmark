[package]
name = "ratmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Render Markdown into Ratatui text, with wrapping, links and syntax highlighting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpulvis/ratmark"
keywords = ["markdown", "ratatui", "tui", "terminal", "wasm"]
categories = ["command-line-interface", "text-processing"]

[features]
default = ["highlight"]
# Syntax highlighting for fenced code blocks, using syntect's pure Rust regex
# engine so it also builds for wasm32.
highlight = ["dep:syntect"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-core = "0.1"
unicode-width = "0.2"
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
unicode-width = "0.2"
