[package]
name = "ratmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Render Markdown into Ratatui text, with wrapping, links and syntax highlighting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpulvis/ratmark"
keywords = ["markdown", "ratatui", "tui", "terminal", "wasm"]
categories = ["command-line-interface", "text-processing"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Syntax highlighting for fenced code blocks, using syntect's pure Rust regex
# engine so it also builds for wasm32.
syntax = ["dep:syntect"]
# Split YAML front matter, between `---` lines, off the top of documents,
# and deserialize it with serde-saphyr.
front-matter-yaml = ["_front-matter", "dep:serde-saphyr"]
# Split TOML front matter, between `+++` lines, off the top of documents,
# and deserialize it with toml.
front-matter-toml = ["_front-matter", "dep:toml"]
# What the front matter formats share. Enable one of them instead.
_front-matter = ["dep:serde"]
# Understand Markdown written for kramdown, like Jekyll sites, read with
# pulldown-kram.
kramdown = ["dep:pulldown-kram"]
# Mark links in MarkdownView's cells, so backends that support it draw real
# links, like OSC 8 in a terminal. Needs Ratatui's cell extensions, which
# aren't released yet, see ratatui/ratatui#2854. Links are made absolute
# with the url crate. To leave out its Unicode domain support, which is most
# of its size, pin `cargo update -p idna_adapter --precise 1.0.0` in your
# application.
links = ["ratatui-core/cell-extensions", "dep:url"]
# Show the text, links and simple formatting of HTML in the Markdown, read
# with html5gum. Without it, HTML is left out.
html = ["dep:html5gum"]
# Scroll the view with the wheel, a trackpad or a finger in the browser,
# following the events with web-sys, in `gesture::web`.
web = ["dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-kram = { git = "https://github.com/nixpulvis/pulldown-kram", optional = true }
# Ratatui's cell extensions, proposed in ratatui/ratatui#2854.
ratatui-core = { git = "https://github.com/WeirdBrains/ratatui", branch = "multi-char-cells" }
unicode-width = "0.2"
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
html5gum = { version = "0.9", optional = true }
url = { version = "2.5", optional = true }
serde = { version = "1", optional = true }
serde-saphyr = { version = "2", optional = true, default-features = false, features = ["deserialize"] }
toml = { version = "1.1", optional = true, default-features = false, features = ["std", "parse", "serde"] }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["AddEventListenerOptions", "DomRect", "Element", "EventTarget", "Touch", "TouchEvent", "TouchList", "WheelEvent", "Window"] }

[dev-dependencies]
# Draws the examples. Its cell extensions write native links as OSC 8.
ratatui-crossterm = { git = "https://github.com/WeirdBrains/ratatui", branch = "multi-char-cells", features = ["cell-extensions"] }
serde = { version = "1", features = ["derive"] }
# Asks the terminal for its background, so the examples pick a dark or light
# theme to match.
terminal-colorsaurus = "1"
unicode-width = "0.2"

[[example]]
name = "syntax"
required-features = ["syntax"]

[[example]]
name = "front_matter"
required-features = ["front-matter-yaml"]

[[example]]
name = "kramdown"
required-features = ["kramdown"]

[[example]]
name = "html"
required-features = ["html"]

[[example]]
name = "links"
required-features = ["links"]

# Takes directories of Markdown as arguments, which libtest can't.
[[test]]
name = "corpus"
harness = false
