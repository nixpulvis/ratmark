[package]
name = "ratmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Render Markdown into Ratatui text, with wrapping, links and syntax highlighting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpulvis/ratmark"
keywords = ["markdown", "ratatui", "tui", "terminal", "wasm"]
categories = ["command-line-interface", "text-processing"]

[features]
default = ["default-syntaxes"]
# Syntax highlighting for fenced code blocks, using syntect's pure Rust regex
# engine so it also builds for wasm32. Bring your own syntaxes and themes with
# `highlight::set`, or turn on `default-syntaxes`.
highlight = ["dep:syntect"]
# Bundle syntect's default syntaxes and themes, a megabyte or two.
default-syntaxes = ["highlight", "syntect/default-syntaxes", "syntect/default-themes"]
# Split YAML or TOML front matter off the top of documents.
front-matter = []
# Understand Markdown written for kramdown, like Jekyll sites.
kramdown = []

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-core = "0.1"
unicode-width = "0.2"
syntect = { version = "5.3", optional = true, default-features = false, features = ["parsing", "regex-fancy"] }

[dev-dependencies]
unicode-width = "0.2"
